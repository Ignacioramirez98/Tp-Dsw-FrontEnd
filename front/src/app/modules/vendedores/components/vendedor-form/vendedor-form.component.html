<a [routerLink]="rutaListado" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Vendedores</a>
<app-page-header [titulo]="titulo" subtitulo="Persona del equipo comercial que concreta ventas." />

@if (cargando) {
  <div class="panel estado-panel" role="status"><i class="bi bi-hourglass-split" aria-hidden="true"></i>Cargando…</div>
} @else {
<form class="panel formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate [attr.aria-label]="titulo">
  @if (errorServidor) {
    <div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>{{ errorServidor }}</span></div>
  }
  <fieldset>
    <legend>Datos del vendedor</legend>
    <div class="grid-campos">
      <app-campo etiqueta="Nombre" para="nombre" [error]="error('nombre')">
        <input class="form-control" type="text" id="nombre" formControlName="nombre" [class.is-invalid]="error('nombre')"
                 [attr.aria-invalid]="!!error('nombre')" [attr.aria-describedby]="error('nombre') ? 'nombre-error' : null" autocomplete="given-name">
      </app-campo>
      <app-campo etiqueta="Apellido" para="apellido" [error]="error('apellido')">
        <input class="form-control" type="text" id="apellido" formControlName="apellido" [class.is-invalid]="error('apellido')"
                 [attr.aria-invalid]="!!error('apellido')" [attr.aria-describedby]="error('apellido') ? 'apellido-error' : null" autocomplete="family-name">
      </app-campo>
      <app-campo etiqueta="DNI" para="dni" [error]="error('dni')">
        <input class="form-control" type="text" id="dni" formControlName="dni" [class.is-invalid]="error('dni')"
                 [attr.aria-invalid]="!!error('dni')" [attr.aria-describedby]="error('dni') ? 'dni-error' : null" inputmode="numeric" placeholder="30.111.222">
      </app-campo>
      <app-campo etiqueta="Teléfono" para="telefono" [error]="error('telefono')">
        <input class="form-control" type="tel" id="telefono" formControlName="telefono" [class.is-invalid]="error('telefono')"
                 [attr.aria-invalid]="!!error('telefono')" [attr.aria-describedby]="error('telefono') ? 'telefono-error' : null" autocomplete="tel" placeholder="341 555-1234">
      </app-campo>
      <app-campo class="ancho-completo" etiqueta="Mail" para="mail" [error]="error('mail')">
        <input class="form-control" type="email" id="mail" formControlName="mail" [class.is-invalid]="error('mail')"
                 [attr.aria-invalid]="!!error('mail')" [attr.aria-describedby]="error('mail') ? 'mail-error' : null" autocomplete="email" placeholder="nombre@dominio.com">
      </app-campo>
    </div>
  </fieldset>
  <div class="pie-formulario">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      @if (guardando) { <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando… }
      @else { <i class="bi bi-check-lg" aria-hidden="true"></i> {{ esEdicion ? 'Guardar cambios' : 'Crear vendedor' }} }
    </button>
  </div>
</form>
}
