<app-header></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-4">Detalle del Cliente</h2>

  <div *ngIf="cargando" class="text-center">Cargando...</div>
  <div *ngIf="error" class="alert alert-warning text-center">{{ error }}</div>

  <div class="card shadow-sm" *ngIf="cliente && !cargando">
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">Nombre</dt>
        <dd class="col-sm-9">{{ cliente.nombre }}</dd>

        <dt class="col-sm-3">Apellido</dt>
        <dd class="col-sm-9">{{ cliente.apellido }}</dd>

        <dt class="col-sm-3">DNI</dt>
        <dd class="col-sm-9">{{ cliente.dni }}</dd>

        <dt class="col-sm-3">Mail</dt>
        <dd class="col-sm-9">{{ cliente.mail }}</dd>

        <dt class="col-sm-3">Teléfono</dt>
        <dd class="col-sm-9">{{ cliente.telefono }}</dd>

        <dt class="col-sm-3">Dirección</dt>
        <dd class="col-sm-9">{{ cliente.direccion }}</dd>

        <dt class="col-sm-3">Razón Social</dt>
        <dd class="col-sm-9">{{ cliente.razon_social }}</dd>
      </dl>

      <div class="d-flex justify-content-end">
        <button class="btn btn-primary mx-2" (click)="editar()">
          <i class="bi bi-pencil"></i> Editar
        </button>
        <button class="btn btn-secondary mx-2" (click)="volver()">
          <i class="bi bi-arrow-left"></i> Volver
        </button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
