<a [routerLink]="rutaListado" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Productos</a>
<app-page-header [titulo]="titulo" subtitulo="Maquinaria o insumo que se vende en el catálogo." />

@if (cargando) {
  <div class="panel estado-panel" role="status"><i class="bi bi-hourglass-split" aria-hidden="true"></i>Cargando…</div>
} @else {
<form class="panel formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate [attr.aria-label]="titulo">
  @if (errorServidor) {
    <div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>{{ errorServidor }}</span></div>
  }
  <fieldset>
    <legend>Descripción</legend>
    <div class="grid-campos">
      <app-campo class="ancho-completo" etiqueta="Nombre" para="nombre" [error]="error('nombre')">
        <input class="form-control" type="text" id="nombre" formControlName="nombre" [class.is-invalid]="error('nombre')"
                 [attr.aria-invalid]="!!error('nombre')" [attr.aria-describedby]="error('nombre') ? 'nombre-error' : null" placeholder="Ej. Tractor 120 HP">
      </app-campo>
      <app-campo class="ancho-completo" etiqueta="Descripción" para="descripcion" [error]="error('descripcion')">
        <textarea class="form-control" rows="3" id="descripcion" formControlName="descripcion" [class.is-invalid]="error('descripcion')"
                 [attr.aria-invalid]="!!error('descripcion')" [attr.aria-describedby]="error('descripcion') ? 'descripcion-error' : null"></textarea>
      </app-campo>
      <div class="ancho-completo"><app-selector-imagen id="imagen-producto" [imagenActual]="imagenActual" [descripcion]="form.value.nombre" (archivoElegido)="imagen = $event" /></div>
    </div>
  </fieldset>
  <fieldset>
    <legend>Precios y stock</legend>
    <div class="grid-campos">
      <app-campo etiqueta="Precio de compra ($)" para="importe_compra" [error]="error('importe_compra')">
        <input class="form-control" type="number" id="importe_compra" formControlName="importe_compra" [class.is-invalid]="error('importe_compra')"
                 [attr.aria-invalid]="!!error('importe_compra')" [attr.aria-describedby]="error('importe_compra') ? 'importe_compra-error' : null" min="0" step="0.01" inputmode="decimal">
      </app-campo>
      <app-campo etiqueta="Precio de venta ($)" para="importe_venta" [error]="error('importe_venta')">
        <input class="form-control" type="number" id="importe_venta" formControlName="importe_venta" [class.is-invalid]="error('importe_venta')"
                 [attr.aria-invalid]="!!error('importe_venta')" [attr.aria-describedby]="error('importe_venta') ? 'importe_venta-error' : null" min="0" step="0.01" inputmode="decimal">
      </app-campo>
      <app-campo etiqueta="Stock (unidades)" para="stock" [error]="error('stock')">
        <input class="form-control" type="number" id="stock" formControlName="stock" [class.is-invalid]="error('stock')"
                 [attr.aria-invalid]="!!error('stock')" [attr.aria-describedby]="error('stock') ? 'stock-error' : null" min="0" step="1" inputmode="numeric">
      </app-campo>
    </div>
  </fieldset>
  <div class="pie-formulario">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      @if (guardando) { <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando… }
      @else { <i class="bi bi-check-lg" aria-hidden="true"></i> {{ esEdicion ? 'Guardar cambios' : 'Crear producto' }} }
    </button>
  </div>
</form>
}
