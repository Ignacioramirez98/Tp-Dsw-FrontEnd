<app-header></app-header>

<div class="operario-form container mt-5">
  <h2 class="text-center mb-4">{{ isEditMode ? 'Editar Operario' : 'Nuevo Operario' }}</h2>

  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="operarioForm" (ngSubmit)="guardar()">
        <div class="row">
          <div class="col-12 col-md-6 mb-4">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" formControlName="nombre" class="form-control" />
            <div *ngIf="operarioForm.get('nombre')?.invalid && operarioForm.get('nombre')?.touched"
              class="text-danger mt-1">
              El nombre es requerido.
            </div>
          </div>

          <div class="col-12 col-md-6 mb-4">
            <label for="apellido" class="form-label">Apellido:</label>
            <input type="text" id="apellido" formControlName="apellido" class="form-control" />
            <div *ngIf="operarioForm.get('apellido')?.invalid && operarioForm.get('apellido')?.touched"
              class="text-danger mt-1">
              El apellido es requerido.
            </div>
          </div>

          <div class="col-12 col-md-6 mb-4">
            <label for="dni" class="form-label">DNI:</label>
            <input type="text" id="dni" formControlName="dni" class="form-control" />
            <div *ngIf="operarioForm.get('dni')?.invalid && operarioForm.get('dni')?.touched"
              class="text-danger mt-1">
              El DNI es requerido.
            </div>
          </div>

          <div class="col-12 col-md-6 mb-4">
            <label for="mail" class="form-label">Mail:</label>
            <input type="email" id="mail" formControlName="mail" class="form-control" />
            <div *ngIf="operarioForm.get('mail')?.invalid && operarioForm.get('mail')?.touched"
              class="text-danger mt-1">
              Ingrese un mail válido.
            </div>
          </div>

          <div class="col-12 col-md-6 mb-4">
            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="text" id="telefono" formControlName="telefono" class="form-control" />
            <div *ngIf="operarioForm.get('telefono')?.invalid && operarioForm.get('telefono')?.touched"
              class="text-danger mt-1">
              El teléfono es requerido.
            </div>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary btn-lg mx-2">
              <i class="bi bi-check-circle"></i> Aceptar
            </button>
            <button type="button" class="btn btn-secondary btn-lg mx-2" (click)="onCancel()">
              <i class="bi bi-x-circle"></i> Cancelar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
