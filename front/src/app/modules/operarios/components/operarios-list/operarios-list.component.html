<app-header></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-4">Operarios</h2>

  <div *ngIf="errorCarga" class="alert alert-warning text-center">
    {{ errorCarga }}
  </div>

  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-primary" (click)="nuevoOperario()">
      <i class="bi bi-plus-circle"></i> Nuevo Operario
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-bordered">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>DNI</th>
          <th>Mail</th>
          <th>Teléfono</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let operario of paginatedOperarios">
          <td>{{ operario.nombre }}</td>
          <td>{{ operario.apellido }}</td>
          <td>{{ operario.dni }}</td>
          <td>{{ operario.mail }}</td>
          <td>{{ operario.telefono }}</td>
          <td class="d-flex justify-content-center align-items-center">
            <button class="btn btn-outline-secondary btn-sm me-2" (click)="verOperario(operario._id)">
              <i class="bi bi-eye"></i> Ver
            </button>
            <button class="btn btn-outline-success btn-sm me-2" (click)="editOperario(operario._id)">
              <i class="bi bi-pencil"></i> Editar
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteOperario(operario._id)">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-controls d-flex justify-content-center mt-4">
    <button class="btn btn-outline-primary me-2" (click)="prevPage()" [disabled]="currentPage === 1">
      <i class="bi bi-arrow-left"></i> Anterior
    </button>
    <span class="fs-5 mx-3 align-self-center">Página {{ currentPage }} de {{ totalPages }}</span>
    <button class="btn btn-outline-primary ms-2" (click)="nextPage()" [disabled]="currentPage === totalPages">
      Siguiente <i class="bi bi-arrow-right"></i>
    </button>
  </div>
</div>

<app-footer></app-footer>
