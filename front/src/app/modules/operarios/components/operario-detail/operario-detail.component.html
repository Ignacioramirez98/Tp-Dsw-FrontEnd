<app-header></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-4">Detalle del Operario</h2>

  <div *ngIf="cargando" class="text-center">Cargando...</div>
  <div *ngIf="error" class="alert alert-warning text-center">{{ error }}</div>

  <div class="card shadow-sm" *ngIf="operario && !cargando">
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">Nombre</dt>
        <dd class="col-sm-9">{{ operario.nombre }}</dd>

        <dt class="col-sm-3">Apellido</dt>
        <dd class="col-sm-9">{{ operario.apellido }}</dd>

        <dt class="col-sm-3">DNI</dt>
        <dd class="col-sm-9">{{ operario.dni }}</dd>

        <dt class="col-sm-3">Mail</dt>
        <dd class="col-sm-9">{{ operario.mail }}</dd>

        <dt class="col-sm-3">Teléfono</dt>
        <dd class="col-sm-9">{{ operario.telefono }}</dd>
      </dl>

      <div class="d-flex justify-content-end">
        <button class="btn btn-primary mx-2" (click)="editar()">
          <i class="bi bi-pencil"></i> Editar
        </button>
        <button class="btn btn-secondary mx-2" (click)="volver()">
          <i class="bi bi-arrow-left"></i> Volver
        </button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
