<app-header></app-header>

<div class="container mt-5 vendedor-dashboard">
  <h1 class="text-center mb-4">Bienvenido!</h1>

  <div class="row justify-content-center">
    <div *ngFor="let card of visibleDashboardCards" class="col-md-4 mb-4">
      <div class="card shadow-sm h-100">
        <img [src]="card.imageUrl" class="card-img-top" [alt]="card.title">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ card.title }}</h5>
          <p class="card-text">{{ card.description }}</p>
          <a [routerLink]="card.route" class="btn btn-primary mt-auto">{{ card.linkText }}</a>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
