<a [routerLink]="rutaListado" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Localidades</a>
<app-page-header [titulo]="titulo" subtitulo="Ciudad o pueblo donde viven los clientes." />

@if (cargando) {
  <div class="panel estado-panel" role="status"><i class="bi bi-hourglass-split" aria-hidden="true"></i>Cargando…</div>
} @else {
<form class="panel formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate [attr.aria-label]="titulo">
  @if (errorServidor) {
    <div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>{{ errorServidor }}</span></div>
  }
  <fieldset>
    <legend>Datos de la localidad</legend>
    <div class="grid-campos">
      <app-campo etiqueta="Nombre" para="nombre" [error]="error('nombre')">
        <input class="form-control" type="text" id="nombre" formControlName="nombre" [class.is-invalid]="error('nombre')"
                 [attr.aria-invalid]="!!error('nombre')" [attr.aria-describedby]="error('nombre') ? 'nombre-error' : null" placeholder="Ej. Rosario">
      </app-campo>
      <app-campo etiqueta="Código postal" para="codigo_postal" [error]="error('codigo_postal')" ayuda="4 dígitos (2000) o CPA (S2000ABC).">
        <input class="form-control" type="text" id="codigo_postal" formControlName="codigo_postal" [class.is-invalid]="error('codigo_postal')"
                 [attr.aria-invalid]="!!error('codigo_postal')" [attr.aria-describedby]="error('codigo_postal') ? 'codigo_postal-error' : null" placeholder="2000" autocomplete="postal-code">
      </app-campo>
    </div>
  </fieldset>
  <div class="pie-formulario">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      @if (guardando) { <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando… }
      @else { <i class="bi bi-check-lg" aria-hidden="true"></i> {{ esEdicion ? 'Guardar cambios' : 'Crear localidad' }} }
    </button>
  </div>
</form>
}
