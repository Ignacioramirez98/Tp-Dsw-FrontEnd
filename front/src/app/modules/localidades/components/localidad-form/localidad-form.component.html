<app-header></app-header>

<div class="localidad-form container mt-5">
  <h2 class="text-center mb-4">{{ isEditMode ? 'Editar Localidad' : 'Nueva Localidad' }}</h2>

  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="localidadForm" (ngSubmit)="guardar()">
        <div class="row">
          <div class="col-12 col-md-6 mb-4">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" formControlName="nombre" class="form-control"
              placeholder="Ingrese el nombre de la localidad" />
            <div *ngIf="localidadForm.get('nombre')?.invalid && localidadForm.get('nombre')?.touched"
              class="text-danger mt-1">
              El nombre es requerido.
            </div>
          </div>

          <div class="col-12 col-md-6 mb-4">
            <label for="codigo_postal" class="form-label">Código Postal:</label>
            <input type="text" id="codigo_postal" formControlName="codigo_postal" class="form-control"
              placeholder="Ingrese el código postal" />
            <div *ngIf="localidadForm.get('codigo_postal')?.invalid && localidadForm.get('codigo_postal')?.touched"
              class="text-danger mt-1">
              El código postal es requerido.
            </div>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary btn-lg mx-2">
              <i class="bi bi-check-circle"></i> Aceptar
            </button>
            <button type="button" class="btn btn-secondary btn-lg mx-2" (click)="onCancel()">
              <i class="bi bi-x-circle"></i> Cancelar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
