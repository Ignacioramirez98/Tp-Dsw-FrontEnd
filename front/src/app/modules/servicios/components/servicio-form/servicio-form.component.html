<a [routerLink]="rutaListado" class="volver"><i class="bi bi-arrow-left" aria-hidden="true"></i> Servicios</a>
<app-page-header [titulo]="titulo" subtitulo="Trabajo técnico que se ofrece a los clientes." />

@if (cargando) {
  <div class="panel estado-panel" role="status"><i class="bi bi-hourglass-split" aria-hidden="true"></i>Cargando…</div>
} @else {
<form class="panel formulario" [formGroup]="form" (ngSubmit)="guardar()" novalidate [attr.aria-label]="titulo">
  @if (errorServidor) {
    <div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i><span>{{ errorServidor }}</span></div>
  }
  <fieldset>
    <legend>Datos del servicio</legend>
    <div class="grid-campos">
      <app-campo class="ancho-completo" etiqueta="Descripción" para="descripcion" [error]="error('descripcion')">
        <textarea class="form-control" rows="3" id="descripcion" formControlName="descripcion" [class.is-invalid]="error('descripcion')"
                 [attr.aria-invalid]="!!error('descripcion')" [attr.aria-describedby]="error('descripcion') ? 'descripcion-error' : null" placeholder="Ej. Service de 250 horas"></textarea>
      </app-campo>
      <app-campo etiqueta="Precio por hora ($)" para="importe_por_hora" [error]="error('importe_por_hora')">
        <input class="form-control" type="number" id="importe_por_hora" formControlName="importe_por_hora" [class.is-invalid]="error('importe_por_hora')"
                 [attr.aria-invalid]="!!error('importe_por_hora')" [attr.aria-describedby]="error('importe_por_hora') ? 'importe_por_hora-error' : null" min="0" step="0.01" inputmode="decimal">
      </app-campo>
      <app-campo etiqueta="Operario responsable" para="operarioId" [error]="error('operarioId')" [opcional]="true">
        <select class="form-select" id="operarioId" formControlName="operarioId" [class.is-invalid]="error('operarioId')"
                 [attr.aria-invalid]="!!error('operarioId')" [attr.aria-describedby]="error('operarioId') ? 'operarioId-error' : null">
          <option value="">Sin asignar</option>
          @for (o of operarios; track o._id) {
            <option [value]="o._id">{{ o.nombre }} {{ o.apellido }}</option>
          }
        </select>
      </app-campo>
      <div class="ancho-completo"><app-selector-imagen id="imagen-servicio" [imagenActual]="imagenActual" [descripcion]="form.value.descripcion" (archivoElegido)="imagen = $event" /></div>
    </div>
  </fieldset>
  <div class="pie-formulario">
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="guardando">
      @if (guardando) { <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> Guardando… }
      @else { <i class="bi bi-check-lg" aria-hidden="true"></i> {{ esEdicion ? 'Guardar cambios' : 'Crear servicio' }} }
    </button>
  </div>
</form>
}
